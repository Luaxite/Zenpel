[toolchain]
# Pinned to the nightly of the last green CI run (`rustc 1.101.0-nightly (92b5b8c87 2026-10-29)`, rustup channel date 2026-10-30). A newer nightly broke
# azalea-chat / azalea-client with `E0391: cycle detected when computing when ... needs async drop`. The CI "azalea toolchain" steps use a dated channel
# here instead of azalea's floating `nightly` (see .github/workflows/rust.yml). To move the pin: set another `nightly-YYYY-MM-DD` once a green run shows it
# (keep AZL_RDJ_FORMAT_RANGE covering its rustdoc JSON format_version).
channel = "nightly-2026-10-30"
